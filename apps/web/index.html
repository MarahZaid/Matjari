<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#175CD3" />
    <meta
      name="description"
      content="Discover thoughtful products from independent stores at Matjari. Many stores. One marketplace."
    />
    <script>
      // Apply the saved preference before styles and React paint; light is the default.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('matjari-theme') === 'dark' ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
      if (document.documentElement.dataset.theme === 'dark') document.querySelector('meta[name="theme-color"]').content = '#111c2e';
    </script>
    <title>Matjari — Many Stores. One Marketplace.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
